<style>
/* =========================================================================
   WEEK 2 — generic scoped overrides, carried over from the Week 1 redesign.
   deck.css stays byte-identical. Headlines are short one-line LABELS, three
   to five words, at one size (CLAUDE.md §3 rule 1, Nils 2026-08-23); the
   claim each slide makes lives in the body and the presenter notes.
   ========================================================================= */
:root{
  /* One step up the ladder. At 1600x900 projected across a lecture hall the
     23px body was the smallest thing anyone at the back could read, and it
     left every two-block slide looking underfilled. */
  --fs-body:25px; --fs-sub:21px; --fs-h3:30px; --fs-cap:19px;

  /* Ported from the Week 1 head (reorg, 2026-08-25), same reasoning verbatim:
     deck.css's --fs-label:16px is two under the harness's 18px projection
     floor and carries every uppercase/mono label (.eyebrow, .thm .kind,
     .format, .step-cue b, ...); and --ink-3 measures 4.45:1 on --paper /
     4.12:1 on --paper-2, under the 4.5:1 floor. Both raised here so the two
     decks stay on one visual system and the per-slide QA pass runs clean. */
  --fs-label:18px;
  --ink-3:#566d85;
}

/* -------------------------------------------------------------- fill the band
   deck.css gives .body align-content:space-evenly. On a slide whose blocks are
   naturally short that does not fill the band -- it pushes two thin strips
   apart and opens a 150px void above, between and below them. Here the blocks
   GROW into the band instead, so a .seq's column rules and a .step-cue's
   dividers run the full height and the slide reads as one frame.
   Scoped away from the layouts that manage their own height. */
.slide:not(.math-slide) .body:not(.admin):not(.split){
  display:flex; flex-direction:column; gap:20px; align-content:stretch}
.slide:not(.math-slide) .body:not(.admin):not(.split)>*{flex:0 0 auto; min-height:0}
.slide:not(.math-slide) .body:not(.admin):not(.split)
  >:is(.seq,.step-cue,.flow,.split,.fig,.ledger,.map,.choices,.points,.steps,.fgsm-read,.admin-cols,.cast-key){
  flex:1 1 auto}
/* the content inside a grown column centres, so the rule beside it is what
   fills the height rather than a block of air */
.body>.step-cue{min-height:0}
.body>.seq>div,.body>.step-cue>div,.body>.fgsm-read>div{min-height:0;
  display:flex; flex-direction:column; justify-content:center}
/* a lone strip should not stretch to 600px and float its text in the middle */
.slide:not(.math-slide) .body:not(.admin):not(.split)>:only-child{flex:1 1 auto}

.question .fig-box>img,.question .fig-box>video,.question .fig-box>svg{ max-height:300px }
.math-slide .body>.split>div:only-child>svg{ height:440px }

/* The 16 -> 18px --fs-label bump (ported from the reorg Week 1 head) grows
   every .step .n and .why by two rungs; on the two five-step math slides that
   pushed the column 5-9px past the band. The house gap is 16px; 12px keeps
   the ladder rhythm and hands back the two label rungs. */
.math-slide .steps{gap:12px}

/* A takeaway is the last thing on most slides now, so it gets a little more
   room to breathe than the single-use version in deck.css assumed. */
.takeaway{ padding-top:14px }
.takeaway p{ font-size:24px }

/* Two .seq strips stacked in one body share the band evenly, the same way
   .flow + .seq already does. Without this the second strip collapses. */
.body:has(>.seq + .seq){display:flex;flex-direction:column;gap:26px}
.body:has(>.seq + .seq)>.seq{flex:1 1 0;min-height:0;align-content:center}
.body:has(>.seq + .seq)>.seq + .seq{padding-top:22px;border-top:1px solid var(--line)}

/* A figure above a full-width strip: the figure takes the space it needs and
   the strip sits under it, rather than both floating in the middle. */
.body:has(>.fig + .step-cue),.body:has(>.fig + .seq){display:flex;flex-direction:column;gap:18px}
.body:has(>.fig + .step-cue)>.fig,.body:has(>.fig + .seq)>.fig{flex:1 1 auto;min-height:0}
.body:has(>.fig + .step-cue)>.fig>.fig-box>svg,
.body:has(>.fig + .seq)>.fig>.fig-box>svg{max-height:100%}

/* A figure that SHARES the band with other blocks must shrink to the track it
   was given. deck.css caps the image at --fig-h, which is sized for a figure
   that owns the whole band; in a three-block body the fig track can be half
   that, and the image then spills past the footer. Give the box a definite
   flex height so the image's max-height:100% actually resolves.
   Figures carrying an .anno overlay are excluded: their .fig-box must keep
   hugging the image, or every annotation coordinate is scaled off target. */
.body>.fig:not(:only-child){display:flex;flex-direction:column;gap:11px;min-height:0}
.body>.fig:not(:only-child)>.fig-box:not(:has(>svg.anno)){
  flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.body>.fig:not(:only-child)>.fig-box:not(:has(>svg.anno))>:is(img,video,svg){
  max-height:100%;width:auto;max-width:100%;object-fit:contain}
.body>.fig:not(:only-child)>.figcap{flex:0 0 auto}

/* An annotated figure cannot be flexed -- its .fig-box must keep hugging the
   image or every .anno coordinate scales off target -- so cap the image itself
   by how many blocks share the band. --fig-h is sized for a figure that owns
   the whole band; with three or four blocks it plainly does not. */
.body:has(>:nth-child(3))>.fig{--fig-h:286px}
.body:has(>:nth-child(4))>.fig{--fig-h:220px}
.body:has(>:nth-child(5))>.fig{--fig-h:180px}

/* Optional slides carry a quiet corner flag so Nils can see at a glance which
   ones are the extras he asked to be able to drop. Hidden in print. */
.slide[data-optional="1"] .canvas::after{
  content:"OPTIONAL"; position:absolute; top:0; right:0;
  padding:5px 12px; background:var(--amber); color:#fff;
  font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.12em; z-index:5}
@media print{ .slide[data-optional="1"] .canvas::after{display:none} }

/* Divider topics (Nils, 21 Sep 2026, on the chapter 1 and 2 dividers: "a short description of what we cover..
   bullet-point style, topics"; "please for the text make it bullet-point topics"): the dek is a list. */
.divider .chv-topics{margin:4px 0 0;padding:0 0 0 28px;color:var(--ink-2);font-size:24px;line-height:1.28}
.divider .chv-topics li{margin:0 0 10px}

/* Lecture rules: a divider that opens a lecture gets the crimson spine so the
   two lectures are visually separable when scrubbing the grid. */
.divider[data-lecture] .canvas::before{background:var(--coral)}

/* A divider that doubles as a roadmap needs a second column. deck.css caps
   .divider-copy at 34ch, which is right for a title and a dek and far too
   narrow for a five-item list -- the list wrapped and ran under the footer. */
.divider .divider-copy:has(.points){
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
  gap:0 60px; max-width:none; align-items:start}
.divider .divider-copy:has(.points)>:not(.points){grid-column:1}
.divider .divider-copy:has(.points)>.points{
  grid-column:2; grid-row:1 / span 20; align-self:center;
  padding-left:46px; border-left:1px solid var(--line)}
.divider .divider-copy:has(.points) .points li{margin-bottom:15px; font-size:var(--fs-sub)}
.divider .divider-copy:has(.points) h1{font-size:58px}

/* Symbol strip. deck.css lays it out in four equal columns, which is right at
   full width and far too tight inside one half of a .split: the cell drops to
   about 110px and a two-word gloss wraps away from its own symbol. Halve the
   column count whenever the strip is inside a split. */
.split .gloss{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 30px}

/* A ledger sharing the band with a gloss strip and a takeaway has to give back
   some row padding, or its last row lands under the footer. */
.body:has(>.ledger):has(>.gloss) .ledger td,
.body:has(>.ledger):has(>.gloss) .ledger th{padding:10px 18px}
.body:has(>.ledger):has(>.gloss) .gloss{margin-top:10px; padding-top:12px}

/* (superseded by the ported Week-1 gloss/KaTeX block below.) */
</style>
<style>
/* Faithful rebuild of a source slide's figure from its raw assets. Positions
   come from the source itself, normalised to the group bounding box, so the
   composition matches the original instead of being a screenshot. */
.recon{position:relative;width:100%;height:0;max-height:var(--fig-h)}
.recon>img{position:absolute;object-fit:contain}
.fig-box:has(>.recon){display:block;width:100%}
</style>
<style>
/* =========================================================================
   TITLE SLIDE — the four-party artwork, the per-week agenda strip, and the
   admin band. Scoped here so the frozen deck.css stays byte-identical. This
   block ships from slides/shared/title-slide.html for every deck.

   · .mark.user  — the amber ● names the party, the user. deck.css only
     defines the mark under its body-slide name "open", which is the wrong
     word for a party, so decks get this alias. The opener no longer uses it
     (the artwork names the parties); body slides still may.
   · .agenda     — the week's two-arc agenda between the lede and the admin
     band. Arc numbers come from a CSS counter, mirroring .points.num.
   · the title-art explanation lives in its hover tooltip, keeping the opener
     image visually clean while preserving the teaching cue for hover and focus.
   ========================================================================= */
.mark.user{color:var(--amber)}  .mark.user::before{content:"\25CF"}
.agenda{display:grid;gap:11px;padding-top:20px;border-top:1px solid var(--line);counter-reset:arc}
.agenda>b{color:var(--green);font-size:18px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.agenda .arc{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:baseline}
.agenda .arc::before{content:counter(arc,decimal-leading-zero);counter-increment:arc;
  font-family:var(--mono);font-size:16px;font-weight:700;color:var(--green);letter-spacing:.02em}
.agenda .arc .t{font-size:var(--fs-sub);font-weight:650;color:var(--ink);letter-spacing:-.01em}
.agenda .arc p{grid-column:2;margin:4px 0 0;color:var(--ink-2);font-size:var(--fs-cap);line-height:1.4}
.agenda .arc p span{white-space:nowrap}  /* topics break at the separators, never mid-item */

/* --- the artwork gets the bigger track ----------------------------------
   The opener artwork is a WIDE scene, so the column width, not the 520px
   height cap, decides how large it renders. deck.css gives the art .94fr,
   a 667px column, at which handwritten labels inside the image fall below
   reading size from the back of the hall. 1.24fr makes it 762px and leaves
   the copy column 614px, which is where two constraints bite: the headline
   must still set on two lines and the agenda's topic list must still wrap to
   two. Do not go wider without re-checking both. */
.title-slide:has(.title-art) .title-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.24fr)}

/* --- cancel the artwork's transparent margins ---------------------------
   Art generated with artifacts/tools/generate_art.py --transparent centres the scene on
   a 1536x1024 canvas, so a wide scene arrives with deep empty bands top and
   bottom. Percentage margins resolve against the flex container's INLINE
   size, which is exactly the image width, so the band depths expressed as a
   fraction of 1536 cancel them at any column width.
   Measured for week02-opener.png off the alpha channel (threshold 24):
   top band 87px, bottom band 169px of the 1536px-wide canvas. */
.title-slide .title-art img{margin-top:-5.66%;margin-bottom:-11.00%}

/* --- the lede is one block ----------------------------------------------
   .title-copy is a space-between flex column. With eyebrow, h1 and dek as
   three separate children it prises the eyebrow off its own headline.
   Grouped, the column distributes three real groups: lede / agenda / foot. */
.title-slide .title-lede{display:block}

/* --- and the three groups share the slack equally -----------------------
   space-between puts all the leftover height into gaps sized by whatever the
   groups happen to measure, which is visibly lopsided. An auto top margin on
   each of the two lower groups makes flexbox split the free space evenly
   between them, with no measured nudge to re-tune when the dek or the topic
   list re-wraps. */
.title-slide .title-copy>.agenda,
.title-slide .title-copy>.title-foot{margin-top:auto}

/* --- admin band at the foot of the copy column --------------------------
   The fixed facts on the left. The rule and the top margin live on the
   wrapper, not on .title-meta, so the hairline spans the full column. */
.title-slide .title-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:34px;align-items:center;padding-top:20px;border-top:1px solid var(--line)}
.title-slide .title-foot .title-meta{gap:44px;margin:0;padding:0;border-top:0}
</style>
<style>
/* --- numbered sources: footer list, and inline references from the body ---
   Springer-style source numbers, so a student can call out "Source 12" in the
   room and find the one line it points at.

   MARKUP, authored in the fragments (numbers never are — see below):
     footer   <span class="citation"><cite class="src"><a href="URL">…</a></cite>…</span>
              One <cite class="src"> per distinct source — one citable thing:
              paper, article, web page, book, dataset, talk. Optional
              data-src-cite="canonical citation" where the visible text is a
              paraphrase ("Course mechanics follow …") rather than a citation.
     inline   <span class="srcref" data-src="URL-or-data-src-cite-string"></span>
              An empty span in body text. Put it where a footnote marker would
              go; it points at whatever number that source already holds.

   BUILT by artifacts/tools/build_deck.py, which resolves both against sources.json and
   writes the finished marker into the HTML as real text:
     footer   <cite class="src" data-n="5"><span class="srcn">[5]</span>…</cite>
     inline   <span class="srcref" data-src="…" data-n="5">[5]</span>
   The text is injected rather than drawn with ::before content so the number is
   in the file itself — it survives a stylesheet that does not load, copies with
   the citation, and does not depend on deck.css or deck.js, both of which are
   frozen and know nothing about any of this.

   Numbers stay out of the fragments because they are a build product: renumber
   a deck and the authored files must not go dirty.

   White on the --green-deep footer is 17.2:1, the brightest thing in the band;
   that is what carries a 12px marker to the back row, against citation text at
   #cdd6ff / 12:1. Bold mono keeps the digits from reading as part of the
   citation's own numerals (years, volume numbers).
   .src is a flex box so the <a> inside it stays a flex item and keeps the
   ellipsis it had when it was a direct child of .citation. */
.footer .citation .src{display:flex;gap:6px;align-items:baseline;min-width:0;
  color:#fff;font-style:normal}
.footer .citation .src>.srcn{flex:0 0 auto;color:#fff;font-family:var(--mono);
  font-weight:700;letter-spacing:0}
.footer .citation .src>a{min-width:0}

/* Three or four sources on one slide. In a single row the citation column gives
   each of four about 150px, which ellipsises every title down to noise, so past
   two they wrap into a 2-up grid: the 46px band holds two 11px lines with room
   to spare, and each source keeps roughly double the width. Titles still have
   to be written short at four — the wrap buys room, it does not buy a sentence.
   build_deck.py stamps data-srcs with the count. */
.footer .citation[data-srcs="3"],
.footer .citation[data-srcs="4"]{flex-wrap:wrap;gap:3px 18px;font-size:11px;line-height:1.2}
.footer .citation[data-srcs="3"] .src,
.footer .citation[data-srcs="4"] .src{flex:1 1 calc(50% - 18px)}

/* Five or six sources: three columns at 11px still clear the band with a line
   to spare. Visible labels must then be written short; each cite carries
   data-src-cite so the registry keeps the full citation. */
.footer .citation[data-srcs="5"],
.footer .citation[data-srcs="6"]{flex-wrap:wrap;gap:3px 16px;font-size:11px;line-height:1.2}
.footer .citation[data-srcs="5"] .src,
.footer .citation[data-srcs="6"] .src{flex:1 1 calc(33.333% - 16px)}

/* The inline marker. --green is 10:1 on --paper and reads as a pointer rather
   than as emphasis; on dark slides it would vanish into the ground, so it takes
   the footer's link blue there (12:1 on --green-deep). Sized in em so it stays
   proportionate in a 25px body line and in a 19px caption alike, and kept
   upright inside italic captions. */
.srcref{margin-left:.15em;color:var(--green);font-family:var(--mono);font-size:max(18px,.78em);
  font-style:normal;font-weight:700;letter-spacing:0;vertical-align:.08em;white-space:nowrap}
.on-deep .srcref{color:#cdd6ff}
</style>
<style>
/* =========================================================================
   PORTED FROM THE SHIPPED WEEK 1 HEAD, 2026-08-25, verbatim.
   slides/week01-introduction/src/_head.html lines 701-802.

   Week 2 was authored against the Week-1 head as it stood BEFORE Nils's
   2026-08-24/25 style directives, so it never received them and consequently
   did not look like Week 1. Everything below is deck-wide (it names no Week-1
   slide) and is copied unchanged so the two decks share one visual system:

     · the full .gloss/KaTeX display repair (Week 2 carried a two-line partial)
     · NILS 2026-08-24 body idiom: .subtitle + ul.bullets, takeaway only when
       the slide has a conclusion to carry away
     · the figure methodology hover (.fig[data-fx] / .fxp)
     · NILS 2026-08-24 warm card family (.note/.thm on warm paper, semantic
       left accent only)
     · NILS 2026-08-25 paper-style theorem environment (amsthm look: no fill,
       rule above and below, bold run-in label)
     · link hover/focus feedback
   Keep this block in sync with Week 1 rather than editing it here.
   ========================================================================= */

/* Deck-wide fix, 2026-08-24. deck.css (frozen) sets `.gloss span{display:block}`
   with a DESCENDANT selector, so it also hits every internal <span> KaTeX emits:
   a subscripted symbol in a gloss strip stacks one atom per line (visible on the
   FGSM slide's x_adv before this fix). KaTeX's own stylesheet leaves most atoms at
   their default display, so nothing outranked the deck rule. Restore the displays
   KaTeX relies on, at higher specificity, for every gloss strip in this deck. The
   LLM-fundamentals fragments also carry scoped copies; those become redundant but
   remain harmless. */
.gloss>span>span{display:inline}
.gloss .katex{display:inline-block;vertical-align:baseline}
.gloss .katex span{display:inline}
.gloss .katex .vlist-t{display:inline-table}
.gloss .katex .vlist-r{display:table-row}
.gloss .katex .vlist,.gloss .katex .vlist-s{display:table-cell}
.gloss .katex .vlist>span{display:block}
.gloss .katex .vlist>span>span,
.gloss .katex .katex-base,.gloss .katex .katex-strut,
.gloss .katex .base,.gloss .katex .strut,
.gloss .katex .mspace,.gloss .katex .nulldelimiter{display:inline-block}

/* NILS 2026-08-24, global style directive: body idiom moves from boxed
   callouts plus loose prose to: h2 label, one .subtitle line saying what the
   slide shows, a short .bullets list (what you see, what it means), figure
   dominant, leader lines into the figure only where they guide attention.
   A bottom .takeaway appears ONLY when a slide has a conclusion students must
   carry away; never as template furniture. */
.subtitle{font-size:24px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em;line-height:1.35;margin:0}
ul.bullets{list-style:none;display:grid;gap:10px;margin:0;padding:0;align-content:start}
ul.bullets li{position:relative;padding-left:22px;font-size:var(--fs-body);color:var(--ink-2);line-height:1.4}
ul.bullets li::before{content:"";position:absolute;left:2px;top:.5em;width:7px;height:7px;background:var(--ink-3)}
ul.bullets li b{color:var(--ink);font-weight:650}
/* The deep closing ground lightens p/li at lower specificity than ul.bullets li;
   mirror deck.css's .on-deep values so the bullets idiom stays legible there. */
.on-deep ul.bullets li{color:#c9d5e5}
.on-deep ul.bullets li b{color:#fff}
.on-deep ul.bullets li::before{background:#c9d5e5}

/* Figure methodology hover (Nils 2026-08-24): a figure carrying data-fx reveals
   a bullets panel on hover describing how its data was recorded. Text lives in
   data-t attributes painted via ::after, so it is invisible to the QA word
   counter and to print; pointer-events:none keeps the lightbox click path.
   Authors: <figure class="fig" data-fx> ... <div class="fxp"><span class="fxh"
   data-t="HOW THIS WAS MEASURED"></span><span class="fx" data-t="..."></span>
   ...</div></figure>; position the panel per slide via inline top/bottom/left/right. */
.fig[data-fx]{cursor:help}
.fig .fxp{display:none;position:absolute;z-index:6;pointer-events:none;background:var(--paper,#f4f7fb);border:1px solid var(--line,#c9d5e5);border-left-width:4px;box-shadow:0 10px 30px rgba(7,27,52,.14);padding:13px 16px;max-width:540px}
.fig[data-fx]:hover .fxp,.fig[data-fx]:focus-within .fxp{display:block}
.fxh{display:block;font-size:12px;font-weight:650;letter-spacing:.09em;color:var(--ink-3,#60768d);margin-bottom:7px}
.fxh::after{content:attr(data-t)}
.fx{display:block;position:relative;padding-left:15px;font-size:15px;line-height:1.4;color:var(--ink-2,#233c57)}
.fx+.fx{margin-top:4px}
.fx::before{content:'\25AA';position:absolute;left:0;color:var(--ink-3,#60768d)}
.fx::after{content:attr(data-t)}
@media print{.fig .fxp{display:none!important}}

/* Warm card family (Nils 2026-08-24): the old boxes were a 5-6px blue-green
   left bar on flat white, which read as template chrome. Information boxes now
   sit on warm paper with a hairline warm border and no bar; only the SEMANTIC
   variants keep a slim left accent in their own colour (crimson attack, amber
   open, teal defense), so the accent is meaning, never decoration. Scoped here
   rather than deck.css so the change is one reviewable block. */
.note,.thm{background:#f8f4ea;border:1px solid #e3dac7;border-left:1px solid #e3dac7;border-radius:3px;box-shadow:0 1px 3px rgba(90,74,40,.07)}
.thm{border-left:4px solid #b9a87e}
.note.attack{border-left:4px solid var(--coral,#a8232c)}
.note.open{background:#faf4e4;border-left:4px solid var(--amber,#8a6410)}
.note.defense{border-left:4px solid #0e6a61}

/* Paper-style theorem environment (Nils 2026-08-25: the tinted card read as
   another callout, not as a definition). This is the amsthm look: no fill, a
   rule above and below, a bold run-in label carrying the number, and the
   statement itself in the body face with italic reserved for the term being
   defined. Numbering convention is week.chapter.index, authored by hand and
   documented in each fragment that uses it. */
.thm{background:none;border:0;border-top:2px solid var(--ink,#071b34);border-bottom:1px solid var(--line,#c9d5e5);
  border-radius:0;box-shadow:none;padding-top:12px;padding-right:4px;padding-bottom:13px;padding-left:4px}
.thm .kind{display:block;margin-bottom:7px;color:var(--ink,#071b34);font-family:var(--sans);
  font-size:var(--fs-label);font-weight:750;letter-spacing:.04em;text-transform:none}
.thm .kind .num{font-variant-numeric:tabular-nums}
.thm p{color:var(--ink-2,#233c57);line-height:1.38}
.thm em,.thm .term{font-style:italic;color:var(--ink,#071b34)}
