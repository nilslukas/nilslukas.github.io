<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 143 16" width="143" height="16" role="img" aria-label="Anthropic">
<!-- ANTHROPIC wordmark, stored locally so the deck presents with no network.

     SOURCE   anthropic.com's own navigation logo, drawn by Anthropic's own Lottie file
              https://cdn.prod.website-files.com/67ce28cfec624e2b733f8a52/
                67d47b4c03b69d41f28cc15c_logo-lottie.json
              which www.anthropic.com loads into <div class="nav_logo_lottie"> and renders
              as SVG. Retrieved and read 2026-08-24. The file declares w=143, h=16, which
              is the viewBox above; the animation is a clip-wipe reveal whose resting frame
              (autoplay off) is the complete wordmark, and that is the frame captured here.

     TREATMENT Each of the nine letterforms is Anthropic's own path, with its own layer
              translation folded into the coordinates so no transform attribute is needed.
              Lottie writes every segment as a cubic even when both control points sit on
              the endpoints; those are rewritten as L, which is the same curve exactly.
              Coordinates are rounded to 3 decimals, i.e. to 7 parts per million of the
              143-unit canvas. Nothing is redrawn, re-spaced, rescaled or recoloured; the
              fill is Anthropic's own rgb(24,24,24).

     USE      Nominative use: it names Anthropic as a place students should read. -->
